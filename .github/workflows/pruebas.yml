name: pruebas
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy scipy openpyxl matplotlib requests beautifulsoup4 lxml ruff
      - name: Estilo del código (ruff)
        run: ruff check . && ruff format --check .
      - name: Pruebas
        run: python -m unittest discover -s tests -v
